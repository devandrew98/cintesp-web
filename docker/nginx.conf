# ============================================================
# CINTESP WEB — nginx: serve o SPA + cache correto.
# ============================================================
server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Compressão
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  # config.js é gerado em runtime → NUNCA cachear.
  location = /config.js {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
  }

  # index.html e service worker → sempre revalidar (para pegar novos deploys).
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
  }
  location = /sw.js {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
  }

  # Assets com hash no nome → cache longo e imutável.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer rota desconhecida cai no index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
